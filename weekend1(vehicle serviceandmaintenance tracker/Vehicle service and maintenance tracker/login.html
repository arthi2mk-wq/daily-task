<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehiclecare</title>
    <link rel="stylesheet" href="app.css">
</head>
<body style="background-image: url(loginimage.png); background-repeat: no-repeat;background-size: cover;">
    <div id="all">
    <div id="login">
        <h1>Welcome Back!</h1>
        <p>Enter your Email and password to access your account</p>
        
        <label for="">Email:</label>
        <input id="email" class="a" type="email" placeholder="     Enter your Email" required><br>
        <label for="">Password:</label>
        <input class="a" id="password" type="password" placeholder="     Enter your password" required><br>
        <div>
        <input type="checkbox" style="height: 20px;width: 20px;">Remember me
        <a href="" style="text-decoration: none; margin-left: 60px;">Forget Password</a>
        </div><br><br>
        <button id="loginbtn" class="a" style="background-color:rgb(25, 114, 149) ;color: white;height: 50px;">Log In</button><br>
        <p style="margin-left: 40px;">Don't have an account <a href="sign.html" style="text-decoration: none;">Register Now</a></p>
        
        
    </div>
    <div>
            <img id="image1" src="loginimage.png" alt="">
     </div>
     </div>
     <script>
        document.getElementById("loginbtn").addEventListener("click",function(){
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            
            let user = JSON.parse(localStorage.getItem("user"));

            if (user === null) {
                alert("No account found. Please register first.");
                return;
              }

            if (email === user.email && password === user.password) {
            
            
                alert("Login Successfully")
                window.location.href="home.html"
            }else{
                alert("Invalid Email or Password")
                return;
            }
        })

     </script>
</body>
</html>
