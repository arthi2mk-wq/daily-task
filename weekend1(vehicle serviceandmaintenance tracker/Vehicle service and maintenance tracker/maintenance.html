    <div style="display: flex;flex-direction: row;">
        <div style="height: 575px;width: 300px;background-color:rgb(25, 114, 149) ;display: flex;flex-direction: column;">
             <a href="home.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;margin-top: 50px;"> Home</a>
           <a href="addvehicle.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;"> Vehicle</a>

        </div>
         <div style="margin-left: 50px;">
            <h1>Maintenance Schedule</h1>
            <div style="display: flex; flex-direction: row;">
            <p>Upcoming services by date or mileage.</p>
            <button id="scheduleService" style="height: 50px;width: 100px;padding: 10px;color: white;background-color:rgb(25, 114, 149)  ;margin-left: 300px;border-radius: 5px;">+ Schedule Service</button>
            
            </div>
           <div id="maintenanceList" style="height:300px;width:700px;border:1px dashed lightgray;padding:20px;
            overflow:auto; margin-top: 20px;">Nothing Scheduled yet</div>
        </div>
    </div>
    </div>
    </div>
    <script>
       document.getElementById("scheduleService").onclick = function () {
      window.location.href = "maintenanceform.html";
      };
       function displayMaintenance() {
       let maintenance = JSON.parse(localStorage.getItem("maintenance")) || [];
       let output = "";
       if (maintenance.length == 0) {
        output = "Nothing Scheduled yet";
      } else {
        let today = new Date();
        today.setHours(0,0,0,0);
        maintenance.forEach(function(m, index){
            let dueDate = new Date(m.dueDate);
            dueDate.setHours(0,0,0,0);
            let status = "";
            let bgColor = "";
            if(dueDate < today){
                status = "Overdue";
                bgColor = "red";
            }
            else if(dueDate.getTime() === today.getTime()){
                status = "Due Today";
                bgColor = "yellow";
            }
            else{
                status = "Upcoming";
                bgColor = "green";
            }
            output += `
            <div style="border:1px solid lightgray;padding:15px;margin-bottom:15px;border-radius:8px;">
             <h3>${m.vehicle}</h3><p><b>Service :</b> ${m.type}</p><p><b>Due Mileage :</b> ${m.dueMileage}</p><p><b>Due Date :</b> ${m.dueDate}</p>
             <span style="background:${bgColor};padding:6px 12px;border-radius:20px;font-weight:bold;">${status}</span><br><br>
            <button onclick="deleteMaintenance(${index})"style="background:red;color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;">Delete</button></div>`;
        });
    }

    document.getElementById("maintenanceList").innerHTML = output;
   }
    function deleteMaintenance(index){
    let maintenance = JSON.parse(localStorage.getItem("maintenance")) || [];
    maintenance.splice(index,1);
    localStorage.setItem("maintenance", JSON.stringify(maintenance));
    displayMaintenance();
    }
    displayMaintenance();
       
    </script>
</body>
