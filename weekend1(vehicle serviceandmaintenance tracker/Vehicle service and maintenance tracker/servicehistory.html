<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="nav" style="height: 50px; width: 1315px;border: 1px solid lightgray;" >
        <img style="height: 50px;width: 50px;" src="logo.png" alt="">
        <p style="font-size: 20px;color:rgb(25, 114, 149) ;"><b>VehicleCare</b></p>
        <nav style="margin-left: 300px;margin-top: 20px;" >
            <a style="padding: 10px;text-decoration: none;" href="home.html">Home</a>
            <a style="padding: 10px;text-decoration: none;" href="addvehicle.html">Our Services</a>
            <a style="padding: 10px;text-decoration: none;" href="aboutus.html">About Us</a>
            <a style="padding: 10px;text-decoration: none;" href="contactus.html">Contact Us</a>
        </nav>
        <!-- <input type="text" placeholder="   search" style="margin-left:50px;margin-top: 10px; height: 30px;width: 200px;border:1px solid lightgrey;border-radius: 20px;"> -->

    </div>
    <div style="display: flex;flex-direction: row;">
        <div style="height: 575px;width: 300px;background-color:rgb(25, 114, 149) ;display: flex;flex-direction: column;">
             <a href="home.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;margin-top: 50px;"> Home</a>
           <a href="addvehicle.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;"> Vehicle</a>
            <a href="servicehistory.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;">Service History</a>
            <a href="maintenance.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;">Maintance</a>
            <a href="search.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;">Search</a>
        </div>
         <div style="margin-left: 50px;">
            <h1>Service History</h1>
            <div style="display: flex; flex-direction: row;">
            <p>Every logged service, most recent first.</p>
            <button id="logService" style="height: 50px;width: 100px;padding: 10px;color: white;background-color:rgb(25, 114, 149)  ;margin-left: 300px;border-radius: 5px;">+ Log Service</button>
            <select name="" id="vehicleSelect">
                <option value="">All Vehicle</option>
            </select>
            </div>
           <div id="serviceList" style="height:300px;width:700px;border:1px dashed lightgray;padding:20px;
            overflow:auto; margin-top: 20px;">No vehicles added</div>
        </div>
    </div>
    
     <script>
      let vehicles = JSON.parse(localStorage.getItem("vehicles")) || [];
      let select = document.getElementById("vehicleSelect");
      vehicles.forEach(function(v){
       select.innerHTML += `<option value="${v.make}">${v.make}</option> `;
      });
      document.getElementById("logService").onclick = function () {
      window.location.href = "serviceform.html";
    };
    function displayServices(){

    let services = JSON.parse(localStorage.getItem("services")) || [];

    let output="";

    if(services.length==0){

        output="No Service Records";

    }else{
        services.forEach(function(s,index){
        output += `<div style="border:1px solid lightgray;padding:15px;margin-bottom:10px;border-radius:5px;"><h3>${s.vehicle}</h3><p>Service : ${s.type}</p><p>Mileage : ${s.mileage}</p><p>Cost : ${s.cost}</p><p>Date : ${s.date}</p><p>Notes : ${s.notes}</p> <button onclick="deleteService(${index})">Delete
         </button> </div> `;
      });
    }
     document.getElementById("serviceList").innerHTML=output;
    }
    displayServices();
    function deleteService(index){
    let services = JSON.parse(localStorage.getItem("services")) || [];
    services.splice(index,1);
    localStorage.setItem("services",JSON.stringify(services));
    displayServices();
    }
   </script>
   
</body>
</html>
