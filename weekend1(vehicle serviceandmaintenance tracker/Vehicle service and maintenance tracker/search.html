<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
     <div id="nav" style="height: 50px; width: 1315px;border: 1px solid lightgray;" >
        <img style="height: 50px;width: 50px;" src="logo.png" alt="">
        <p style="font-size: 20px;color:rgb(25, 114, 149) ;"><b>VehicleCare</b></p>
        <nav style="margin-left: 300px;margin-top: 20px;" >
            <a style="padding: 10px;text-decoration: none;" href="home.html">Home</a>
            <a style="padding: 10px;text-decoration: none;" href="addvehicle.html">Our Services</a>
            <a style="padding: 10px;text-decoration: none;" href="aboutus.html">About Us</a>
            <a style="padding: 10px;text-decoration: none;" href="contactus.html">Contact Us</a>
        </nav>
       

    </div>
    <div style="display: flex;flex-direction: row;">
        <div style="height: 575px;width: 300px;background-color:rgb(25, 114, 149) ;display: flex;flex-direction: column;">
             <a href="home.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;margin-top: 50px;"> Home</a>
           <a href="addvehicle.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;"> Vehicle</a>
            <a href="servicehistory.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;">Service History</a>
            <a href="maintenance.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;">Maintance</a>
            <a href="search.html" style="margin: 10px;padding: 5px;color: white;text-decoration: none;font-size: 20px;margin-left: 50px;">Search</a>
        </div>
        <div  style="margin: 20px;margin-left: 50px;">
            <h2>Search Records</h2>
            <p>Search by service type, vehicle, date, or notes.</p>
            <input id="searchBox" placeholder="      Oil Change, Toyota, 50000, 2026-07-25" type="search" name="" id="" style="height: 30px;width: 600px; ">
            <div id="maintenanceList" style="height:300px;width:600px;border:1px dashed lightgray;padding:20px;overflow:auto;margin-top:20px;">
            No match found</div>
        </div>
    </div>
    <script>
        let search = document.getElementById("searchBox");
        search.addEventListener("keyup", searchRecords);
        function searchRecords(){
        let keyword = search.value.toLowerCase();
        let services = JSON.parse(localStorage.getItem("services")) || [];
        let maintenance = JSON.parse(localStorage.getItem("maintenance")) || [];
        let vehicles = JSON.parse(localStorage.getItem("vehicles")) || [];
        let output = "";
        vehicles.forEach(function(v){
        if(
            v.make.toLowerCase().includes(keyword) ||
            v.type.toLowerCase().includes(keyword) ||
            v.reg.toLowerCase().includes(keyword) ||
            v.year.toString().includes(keyword) ||
            v.mileage.toString().includes(keyword)
        ){
            output += `
            <div style="border:1px solid lightgray;padding:10px;margin-bottom:10px;"><h3>Vehicle</h3><p><b>Make:</b> ${v.make}</p><p><b>Type:</b> ${v.type}</p><p><b>Registration:</b> ${v.reg}</p><p><b>Mileage:</b> ${v.mileage}</p></div>`;
        }

    });
    services.forEach(function(s){

        if(
            s.vehicle.toLowerCase().includes(keyword) ||
            s.type.toLowerCase().includes(keyword) ||
            s.date.toLowerCase().includes(keyword) ||
            s.notes.toLowerCase().includes(keyword) ||
            s.mileage.toString().includes(keyword)
        ){

            output += `<div style="border:1px solid lightgray;padding:10px;margin-bottom:10px;"><h3>Service Record</h3> <p><b>Vehicle:</b> ${s.vehicle}</p> <p><b>Service:</b> ${s.type}</p> <p><b>Date:</b> ${s.date}</p><p><b>Mileage:</b> ${s.mileage}</p></div>`;
        }

    });
    maintenance.forEach(function(m){

        if(
            m.vehicle.toLowerCase().includes(keyword) ||
            m.type.toLowerCase().includes(keyword) ||
            m.dueDate.toLowerCase().includes(keyword) ||
            m.dueMileage.toString().includes(keyword)
        ){

            output += `<div style="border:1px solid lightgray;padding:10px;margin-bottom:10px;"><h3>Maintenance</h3><p><b>Vehicle:</b> ${m.vehicle}</p><p><b>Service:</b> ${m.type}</p><p><b>Due Date:</b> ${m.dueDate}</p> <p><b>Due Mileage:</b> ${m.dueMileage}</p></div>`;
        }

    });

    if(output == ""){
        output = "<h3>No Match Found</h3>";
    }

    document.getElementById("maintenanceList").innerHTML = output;
}
    </script>
</body>
</html>
